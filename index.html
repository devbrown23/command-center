<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pirata+One&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>☠ Command Center</h1>
      <div class="tagline">Captain's log · Set sail for the Grand Line</div>
    </div>
    <div class="top-actions">
      <label>Month <input type="month" id="month"></label>
      <button id="export" class="ghost">Export backup</button>
      <label class="ghost btn-file">Import backup<input type="file" id="import" accept="application/json" hidden></label>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>
  <main id="view"></main>

  <footer class="foot">Your data is saved in this browser only. Use Export backup to keep a copy or move it to another device.</footer>

  <script src="crm.js"></script>
  <script src="app.js"></script>
</body>
</html>
