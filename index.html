<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Command Center">
</head>
<body>
  <header class="top">
    <div>
      <h1>☠ Command Center</h1>
      <div class="tagline">Captain's log · Navigating the New World</div>
    </div>
    <div class="top-actions">
      <label>Month <input type="month" id="month"></label>
      <span id="sync-status" class="muted"></span>
      <button id="export" class="ghost">Export backup</button>
      <label class="ghost btn-file">Import backup<input type="file" id="import" accept="application/json" hidden></label>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>
  <main id="view"></main>

  <footer class="foot">Your data is saved on this device. Turn on cloud sync in Daily 20 CRM → CRM settings to share it with your phone and laptop, and use Export backup for an extra copy.</footer>

  <script src="crm.js"></script>
  <script src="plan.js"></script>
  <script src="inbox.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
